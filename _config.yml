about_content: |
  최근 제 개발 방식에서 가장 큰 변화는 AI입니다.

  예전에는 새로운 아이디어나 아키텍처를 떠올려도 실제로 구현할 시간이 부족했습니다. 머릿속으로는 설계를 끝내더라도 업무와 일상에 쫓기다 보면 직접 만들어 보고 검증할 기회를 갖기 어려웠습니다. 하지만 AI를 적극적으로 활용하기 시작하면서 이러한 제약이 크게 줄었습니다. 이제는 문제를 정의하고 구조를 설계하면 AI와 함께 빠르게 구현하고 검증할 수 있게 되었고 개발은 다시 가장 즐기는 취미가 되었습니다.

  이러한 변화는 실제 결과물로 이어졌습니다. 앞으로 개발할 다양한 서비스를 효율적으로 관리하고 운영하기 위해 [HansApp Backend Platform](https://plzhans.com)을 직접 구축했습니다. OAuth 기반 인증, API Key 관리, 공통 API 등 여러 서비스에서 반복되는 기능을 플랫폼으로 분리해 새로운 서비스를 빠르게 개발할 수 있는 기반을 마련했습니다.

  그리고 직접 만든 플랫폼을 사용하여 [MediFinder](https://medifinder.kr)를 직접 기획하고 개발했습니다. 건강보험심사평가원(HIRA)과 국립중앙의료원(NMC)의 공공데이터를 활용해 AI 기반 병원 정보 검색 서비스를 만들었으며, 실제 운영을 통해 새로운 기술과 아키텍처를 지속적으로 검증하고 개선하고 있습니다.

  AI는 개발뿐 아니라 일상에서도 중요한 도구가 되었습니다. 개인 AI 비서(OpenClaw)를 구축해 자녀의 어린이집 알림장을 관리하고, 가족 일정과 여행 계획을 정리하는 등 반복적인 개인 업무를 자동화하며 일상에서도 AI를 적극 활용하고 있습니다.

  이처럼 새로운 기술을 적극적으로 받아들이는 개발자이지만 그 기반에는 오랜 실무 경험이 있습니다.
  웹개발로 커리어를 시작해 다양한 서비스의 설계, 개발, 운영을 경험했습니다. 초기에는 웹 서비스와 백오피스 시스템을 중심으로 인증, 빌링, 통계, 운영 도구 등을 개발하며 서비스의 기반을 다졌고, 이후 모바일 게임 서버와 플랫폼 개발 영역으로 확장하며 단순한 기능 구현보다 장기적으로 안정적으로 운영될 수 있는 구조를 만드는 일에 집중해 왔습니다.

  트래픽 증가와 서비스 확장, 운영 비용과 안정성, 개발 생산성과 유지보수성 사이의 균형을 고민하며 시스템 전반을 구조적으로 개선하는 일을 주로 수행했습니다. 여러 프로젝트에서는 개발자이자 리더 역할을 맡아 기술 선택과 아키텍처 방향을 결정하고 팀이 안정적으로 개발을 이어갈 수 있는 환경을 만드는 데 집중했습니다.

  특정 언어나 기술에 스스로를 한정하기보다 서비스의 목적과 팀의 상황에 맞는 기술을 선택하는 것을 중요하게 생각합니다. C#, Java, Node.js, Python, Rust 등 다양한 언어와 환경을 경험했으며 새로운 기술 역시 실제 생산성과 운영 효율을 기준으로 빠르게 익히고 적용하는 편입니다.

  저는 개발을 단순히 코드를 작성하는 일이 아니라 문제를 해결하고 지속 가능한 서비스를 만드는 과정이라고 생각합니다. AI 시대에도 가장 중요한 것은 구현 속도가 아니라 문제를 정의하고 구조를 설계하는 능력이라고 믿습니다. 앞으로도 새로운 기술을 적극적으로 활용해 아이디어를 실제 서비스로 만들고 운영을 통해 검증하며 더 나은 시스템을 만들어가는 개발자로 기여하고자 합니다. 감사합니다.
