about_content: |
  웹 개발로 커리어를 시작해 15년 이상 다양한 서비스의 설계·개발·운영을 경험해 왔습니다.

  초기에는 웹 서비스와 백오피스 시스템을 중심으로 인증, 빌링, 통계, 운영툴 등을 개발하며
  서비스 구성 요소들이 어떻게 연결되고 운영되는지에 대한 기본기를 다졌습니다.

  이후 모바일 게임 서버와 플랫폼 개발 영역으로 확장하며
  단순 기능 구현보다 서비스가 장기적으로 안정적으로 운영될 수 있는 구조를 만드는 역할을 맡아 왔습니다.

  트래픽 증가, 서비스 확장, 운영 비용과 안정성, 개발 생산성과 유지보수성 사이의 균형을 고민하며
  시스템 전반을 구조적으로 개선하는 일을 주로 해왔습니다.

  여러 프로젝트에서 개발자이자 팀 리더 역할을 수행하며
  기술 선택과 아키텍처 방향을 결정하고 팀이 안정적으로 개발을 이어갈 수 있는 환경을 만드는 데 집중했습니다.

  문제를 단순히 해결하는 데서 그치지 않고,
  같은 문제가 반복되지 않도록 구조와 흐름을 정리하는 방식을 선호합니다.

  특정 언어나 도메인에 스스로를 한정하기보다는
  서비스의 목적과 팀 상황에 맞는 기술을 선택하는 것을 중요하게 생각합니다.

  C#, TypeScript, Rust, Java, Python 등 다양한 언어와 환경을 경험했으며,
  새로운 기술을 도입할 때도 실질적인 효과와 운영 관점에서의 이점을 기준으로 판단해 왔습니다.

  개발은 업무이기 이전에 문제를 해결하는 과정이라고 생각합니다.
  개인적으로도 일상에서 불편한 점을 개선하기 위한 소규모 자동화 도구나
  백업 프로그램을 만들어 사용하는 것을 즐깁니다.

  앞으로도 팀과 서비스에 안정감을 줄 수 있는 개발자로서
  복잡한 문제를 단순하게 정리하고 지속 가능한 구조를 만들어 가는 역할을 수행하고자 합니다.
